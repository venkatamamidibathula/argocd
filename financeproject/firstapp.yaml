apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: financeapp
  namespace: argocd
spec:
  project: financeproject

  source:
    repoURL: https://github.com/venkatamamidibathula/guestbookprivaterepo.git
    targetRevision: master
    path: helm-guestbook

  destination:
    server: https://kubernetes.default.svc
    namespace: finance
  syncPolicy:
    automated:
      prune: true
